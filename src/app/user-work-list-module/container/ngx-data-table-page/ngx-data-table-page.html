<app-navbar></app-navbar>

<div class="page-container">
  <div class="page-header">
    <div class="header-content">
      <div class="icon-box">
        <mat-icon>groups</mat-icon>
      </div>
      <div class="text-content">
        <h1>User Directory</h1>
        <p>Managing and viewing all administrative users from the database</p>
      </div>
    </div>
  </div>

  <div class="table-card">
    <mat-progress-bar
      mode="indeterminate"
      *ngIf="loadingIndicator"
      class="loading-bar"
    ></mat-progress-bar>
    <div class="table-container">
      <ngx-datatable
        class="material striped"
        [rows]="rows"
        [loadingIndicator]="loadingIndicator"
        [columnMode]="ColumnMode.force"
        [headerHeight]="60"
        [footerHeight]="60"
        rowHeight="auto"
        [limit]="10"
        [messages]="{
          emptyMessage: 'No data to display',
          totalMessage: 'total',
          selectedMessage: 'selected',
        }"
      >
        <ngx-datatable-column name="Name" prop="name" [flexGrow]="1">
          <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
            <div class="name-cell">
              <div class="avatar">{{ value ? value.charAt(0) : '' }}</div>
              <div class="name-info">
                <span class="full-name">{{ value }}</span>
                <span class="user-id">ID: {{ row.id }}</span>
              </div>
            </div>
          </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column name="Email" prop="email" [flexGrow]="1"></ngx-datatable-column>
        <ngx-datatable-column name="Phone" prop="phone" [flexGrow]="1"></ngx-datatable-column>
        <ngx-datatable-column name="Website" prop="website" [flexGrow]="1"></ngx-datatable-column>
        <ngx-datatable-column
          name="Company"
          prop="company.name"
          [flexGrow]="1"
        ></ngx-datatable-column>

        <ngx-datatable-column name="Action" prop="id" [flexGrow]="1" [sortable]="false">
          <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
            <div class="action-buttons">
              <button class="action-btn edit" title="Edit User" (click)="editUser(row)">
                <mat-icon>edit</mat-icon>
              </button>
              <button class="action-btn delete" title="Delete User" (click)="deleteUser(row)">
                <mat-icon>delete_outline</mat-icon>
              </button>
            </div>
          </ng-template>
        </ngx-datatable-column>
      </ngx-datatable>
    </div>
  </div>
</div>
