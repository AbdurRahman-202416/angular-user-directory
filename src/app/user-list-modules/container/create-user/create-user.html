<app-navbar></app-navbar>

<form [formGroup]="userForm" (ngSubmit)="submit()" class="user-form">
  <h2>User Info Form</h2>

  <div class="form-group">
    <label>Username <span style="color: red">*</span></label>
    <input type="text" formControlName="username" />
    <small *ngIf="userForm.get('username')?.touched && userForm.get('username')?.invalid">
      Username is required
    </small>
  </div>

  <div class="form-group">
    <label>Email <span style="color: red">*</span></label>
    <input type="email" formControlName="email" />
    <small *ngIf="userForm.get('email')?.touched && userForm.get('email')?.invalid">
      Email is required and must be valid
    </small>
  </div>

  <div class="form-group">
    <label>Phone <span style="color: red">*</span></label>
    <input type="text" formControlName="phone" />
    <small *ngIf="userForm.get('phone')?.touched && userForm.get('phone')?.invalid">
      Phone is required
    </small>
  </div>

  <div class="form-group" formArrayName="skills">
    <label>Your Skills <span style="color: red">*</span></label>
    <div
      class="skill-row"
      *ngFor="let skillsGroup of skills.controls; let i = index"
      [formGroupName]="i"
    >
      <input formControlName="skillsName" placeholder="Enter Your Skills" />
      <button
        *ngIf="skills.controls.length > 1"
        (click)="removeSkill(i)"
        class="btn-remove"
        type="button"
      >
        ⌫
      </button>

      <small
        *ngIf="skills.at(i).get('skillsName')?.touched && skills.at(i).get('skillsName')?.invalid"
      >
        Skills name is required
      </small>
    </div>
    <button class="btn-add" type="button" (click)="addSkill()">+ Add More Skill</button>
  </div>

  <div class="form-group">
    <label>Password <span style="color: red">*</span></label>
    <input type="password" formControlName="password" />
    <small *ngIf="userForm.get('password')?.touched && userForm.get('password')?.invalid">
      Password is required
    </small>
  </div>

  <div class="form-group">
    <label>Address </label>
    <textarea formControlName="address"></textarea>
  </div>

  <div class="btn-group">
    <button type="button" class="btn secondary" (click)="goBack()">⏎ Previous</button>
    <button type="submit" class="btn primary" [disabled]="userForm.invalid">
      {{ userForm.invalid ? 'ⓘ' : '🗁' }} Save User
    </button>
  </div>
</form>
